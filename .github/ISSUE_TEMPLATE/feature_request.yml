name: Feature request / 功能建议
description: Suggest an improvement. / 提出改进建议。
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What are you trying to do, and what gets in the way? / 你想做什么,遇到了什么阻碍?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案

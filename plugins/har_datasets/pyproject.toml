[project]
name = "researchos-plugin-har_datasets"
version = "0.1.0"
description = "Research OS contracts 1.2 har_datasets plugin"
requires-python = ">=3.11,<3.14"
dependencies = ["researchos>=0.1", "numpy>=1.26", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=2.4", "build", "hatchling"]

[project.entry-points."researchos.plugins"]
researchos_plugin_har_datasets = "researchos_plugin_har_datasets:MANIFEST"

[project.entry-points."researchos.datasources"]
har_uci = "researchos_plugin_har_datasets.providers:UciHarProvider"
har_wisdm = "researchos_plugin_har_datasets.providers:WisdmProvider"

[project.entry-points."researchos.templates"]
har_np = "researchos_plugin_har_datasets:np_package"

[tool.uv.sources]
researchos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchos_plugin_har_datasets"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
follow_imports = "silent"
follow_untyped_imports = true
native_parser = false

[[tool.mypy.overrides]]
module = ["har_models"]  # template-local module (run.py is executed from its own directory)
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bibtexparser.*", "sklearn.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "researchos-plugin-diag_stats"
version = "0.1.0"
description = "Research OS plugin: read-only diagnostic-accuracy statistics tools + statistics appendix exporter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Only researchos.contracts / researchos.sdk are imported from core.
dependencies = ["researchos>=0.1", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14"]

[project.optional-dependencies]
golden = []  # compatibility extra: statsmodels is now a runtime dependency
survival = ["lifelines==0.30.3"]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=2.4", "jsonschema>=4.26", "lifelines==0.30.3"]

[project.entry-points."researchos.plugins"]
researchos_plugin_diag_stats = "researchos_plugin_diag_stats:MANIFEST"

[project.entry-points."researchos.tools"]
stats_power = "researchos_plugin_diag_stats.power:BINDING"
stats_diag_metrics = "researchos_plugin_diag_stats.diag_metrics:BINDING"
stats_roc_auc = "researchos_plugin_diag_stats.roc:BINDING"
stats_paired_tests = "researchos_plugin_diag_stats.paired:BINDING"
stats_cluster_bootstrap = "researchos_plugin_diag_stats.bootstrap:BINDING"
stats_multiplicity = "researchos_plugin_diag_stats.multiplicity:BINDING"
stats_compare_groups = "researchos_plugin_diag_stats.compare:BINDING"
stats_survival = "researchos_plugin_diag_stats.survival:BINDING"

[project.entry-points."researchos.exporters"]
stats_report = "researchos_plugin_diag_stats.report:StatsReportExporter"

[tool.uv.sources]
researchos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchos_plugin_diag_stats"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["src", "tests"]
follow_untyped_imports = true  # researchos core ships no py.typed marker

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "statsmodels", "statsmodels.*"]
follow_untyped_imports = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

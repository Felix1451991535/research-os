[project]
name = "researchos-plugin-medimg_dicom"
version = "0.1.0"
description = "Research OS plugin: local DICOM folder -> image dataset (pseudonymous groups, PHI preflight); research use only"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Only researchos.contracts / researchos.sdk are imported from core. pydicom is MIT.
dependencies = ["researchos>=0.1", "numpy>=1.26", "pydicom==3.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=2.4", "jsonschema>=4.26"]

[project.entry-points."researchos.plugins"]
researchos_plugin_medimg_dicom = "researchos_plugin_medimg_dicom:MANIFEST"

[project.entry-points."researchos.datasources"]
medimg_dicom_folder = "researchos_plugin_medimg_dicom.provider:DicomFolderProvider"

[tool.uv.sources]
researchos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchos_plugin_medimg_dicom"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["src", "tests"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["pydicom", "pydicom.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "researchos-plugin-zotero_import"
version = "0.1.0"
description = "Research OS plugin: Zotero import (CSL-JSON and RDF exports, Zotero Web API)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Only researchos.contracts / researchos.sdk are imported from core. defusedxml is optional (used if installed).
dependencies = ["researchos>=0.1"]

[project.optional-dependencies]
safe-xml = ["defusedxml>=0.7"]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=2.4"]

[project.entry-points."researchos.plugins"]
researchos_plugin_zotero_import = "researchos_plugin_zotero_import:MANIFEST"

[project.entry-points."researchos.importers"]
zotero_csljson = "researchos_plugin_zotero_import.csljson:ZoteroCslJsonImporter"
zotero_rdf = "researchos_plugin_zotero_import.rdf:ZoteroRdfImporter"
zotero_web = "researchos_plugin_zotero_import.web:ZoteroWebImporter"

[tool.uv.sources]
researchos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchos_plugin_zotero_import"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["src", "tests"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*"]
follow_untyped_imports = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
